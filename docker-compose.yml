name: ${RENOVA_COMPOSE_PROJECT:?Run pnpm run setup first}

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: ${POSTGRES_DB:?Required}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Required}
      POSTGRES_MIGRATOR_PASSWORD: ${POSTGRES_MIGRATOR_PASSWORD:?Required}
      POSTGRES_RUNTIME_PASSWORD: ${POSTGRES_RUNTIME_PASSWORD:?Required}
      RENOVA_DB_PROJECT_ID: ${RENOVA_DB_PROJECT_ID:?Required}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:?Required}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./scripts/db/init.sql:/docker-entrypoint-initdb.d/01-renova.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d \"$$POSTGRES_DB\""]
      interval: 1s
      timeout: 3s
      retries: 30

volumes:
  postgres_data:
